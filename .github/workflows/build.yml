name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Kill Gradle daemon and set JDK
        shell: pwsh
        run: |
          ./gradlew --stop 2>$null
          $javaHome = $env:JAVA_HOME
          Write-Host "JAVA_HOME = $javaHome"
          $jpackage = Join-Path $javaHome "bin\jpackage.exe"
          if (Test-Path $jpackage) {
            Write-Host "jpackage found: $jpackage"
            & $jpackage --version
          }
          # Write to gradle.properties
          Add-Content -Path "gradle.properties" -Value "`norg.gradle.java.home=$javaHome"
          Get-Content "gradle.properties"

      - name: Run tests
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: Package EXE
        run: ./gradlew packageExe --no-daemon --stacktrace

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WeChatMonitor-EXE
          path: build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn
